<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小七 · 虚拟卧室</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="day">

  <!-- ═══════════ 小七的虚拟卧室 ═══════════ -->
  <div id="room" class="room-scene">
    <div class="sky"></div>
    <div class="sun"></div>
    <div class="moon"></div>

    <!-- 窗户（点击：时间/天气占位） -->
    <div id="window" class="obj window">
      <div class="window-frame">
        <div class="cityscape"></div>
        <div class="glass"></div>
      </div>
      <span class="obj-label">窗外</span>
    </div>

    <div class="room-interior">
      <div class="wall"></div>
      <div class="floor"></div>

      <div class="wall-decor">
        <div class="poster"></div>
        <div class="shelf">
          <span class="book b1"></span>
          <span class="book b2"></span>
          <span class="book b3"></span>
        </div>
      </div>

      <!-- 物件：床 -->
      <div id="bed" class="obj bed" data-target="bed">
        <div class="bed-frame">
          <div class="pillow"></div>
          <div class="blanket"></div>
        </div>
        <span class="obj-label">床</span>
      </div>

      <!-- 物件：书桌 -->
      <div id="desk" class="obj desk" data-target="desk">
        <div class="desk-top"></div>
        <div class="desk-leg"></div>
        <div class="book-open"></div>
        <div class="lamp-mini"></div>
        <span class="obj-label">书桌</span>
      </div>

      <!-- 物件：沙发 -->
      <div id="sofa" class="obj sofa" data-target="sofa">
        <div class="sofa-arm a"></div>
        <div class="sofa-seat"></div>
        <div class="sofa-arm b"></div>
        <span class="obj-label">沙发</span>
      </div>

      <!-- 物件：台灯 -->
      <div id="lamp" class="obj lamp" data-target="lamp">
        <div class="lamp-stand"></div>
        <div class="lamp-shade"></div>
        <span class="obj-label">台灯</span>
      </div>

      <!-- 物件：植物 -->
      <div id="plant" class="obj plant">
        <div class="pot"></div>
        <span class="leaf l1"></span>
        <span class="leaf l2"></span>
        <span class="leaf l3"></span>
      </div>

      <!-- 小七（Avatar2D 挂载点） -->
      <div id="avatar-mount"></div>

      <div class="light-fx"></div>
      <div class="rain"></div>
    </div>
  </div>

  <!-- 空房间提示 / 交互反馈 -->
  <div id="interact-tip" class="interact-tip hidden"></div>

  <!-- ═══════════ 轻量状态 HUD（可隐藏） ═══════════ -->
  <div id="hud" class="hud hidden">
    <div class="hud-toggle" id="hud-toggle">⋯</div>
    <div class="hud-body">
      <div class="hud-row"><span>💗 心情</span><b id="hud-emotion">-</b></div>
      <div class="hud-row"><span>⚡ 精力</span><b id="hud-energy">-</b></div>
      <div class="hud-row"><span>💤 疲劳</span><b id="hud-fatigue">-</b></div>
      <div class="hud-row"><span>📅 活动</span><b id="hud-activity">-</b></div>
    </div>
  </div>

  <!-- ═══════════ 底部操作栏 ═══════════ -->
  <nav class="toolbar">
    <button id="voice-btn" title="语音 · 开发中" disabled>🎤<span>语音</span></button>
    <button id="chat-btn" title="对话">💬<span>对话</span></button>
    <button id="relation-btn" title="关系">💗<span>关系</span></button>
    <button id="schedule-btn" title="日程">📅<span>日程</span></button>
    <button id="settings-btn" title="设置">⚙️<span>设置</span></button>
  </nav>

  <!-- ═══════════ 对话抽屉（气泡历史） ═══════════ -->
  <div id="chat-drawer" class="chat-drawer hidden">
    <div class="drawer-head">
      <strong>和小七对话</strong>
      <button id="chat-close" class="close-btn">×</button>
    </div>
    <div id="chat-history" class="chat-history"></div>
    <div class="chat-composer">
      <input id="chat-input" placeholder="发消息给小七…" autocomplete="off">
      <button id="chat-send">➤</button>
    </div>
  </div>

  <!-- ═══════════ 关系面板 ═══════════ -->
  <div id="relation-panel" class="panel hidden">
    <div class="drawer-head">
      <strong>💗 与小七的关系</strong>
      <button id="relation-close" class="close-btn">×</button>
    </div>
    <div id="relation-content" class="panel-content"></div>
  </div>

  <!-- ═══════════ 日程面板 ═══════════ -->
  <div id="schedule-panel" class="panel hidden">
    <div class="drawer-head">
      <strong>📅 她的日程</strong>
      <button id="schedule-close" class="close-btn">×</button>
    </div>
    <div id="schedule-content" class="panel-content"></div>
  </div>

  <!-- ═══════════ 设置面板 ═══════════ -->
  <div id="settings-panel" class="panel hidden">
    <div class="drawer-head">
      <strong>⚙️ 设置</strong>
      <button id="settings-close" class="close-btn">×</button>
    </div>
    <div class="panel-content settings">
      <label>小七名字 <input id="set-name" value="小七"></label>
      <label>用户称呼 <input id="set-user-name" placeholder="主人"></label>
      <label class="switch"><span>显示状态 HUD</span><input id="set-hud" type="checkbox" checked></label>
      <label class="switch"><span>允许主动消息</span><input id="set-proactive" type="checkbox" checked></label>
      <label class="switch"><span>夜间模式</span><input id="set-night" type="checkbox"></label>
      <label class="switch"><span>音效</span><input id="set-sound" type="checkbox"></label>
      <p class="settings-note">模拟速度：<b id="set-speed">-</b> 分钟/秒</p>
      <p class="settings-note voice-note">🎤 语音功能即将接入（WebRTC / VAD / Whisper / TTS）</p>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
