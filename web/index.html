<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>小七</title>
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/three.module.js" } }
  </script>
</head>
<body class="day">

  <!-- ═══════ 顶部栏 ═══════ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-avatar">小</div>
      <div class="brand-text">
        <strong>小七</strong>
        <small id="status-text">在线</small>
      </div>
    </div>

    <div class="topbar-center">
      <nav class="main-nav">
        <button id="nav-home" class="nav-btn active">🏠 <span>小家</span></button>
        <button id="nav-chat" class="nav-btn">💬 <span>聊天</span></button>
        <button id="nav-voice" class="nav-btn">🎙 <span>语音</span></button>
      </nav>
    </div>

    <div class="topbar-right">
      <span id="time-display" class="time-display"></span>
      <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
    </div>
  </header>

  <!-- ═══════ 主区域 ═══════ -->
  <main class="main-area">

    <!-- 小家视图：房间 + 小七 -->
    <section id="view-home" class="view active">
      <div id="room" class="room-scene">
        <div class="sky"></div>
        <div class="sun"></div>
        <div class="moon"></div>

        <div class="window">
          <div class="window-frame">
            <div class="cityscape"></div>
            <div class="glass"></div>
          </div>
        </div>

        <div class="room-interior">
          <div class="wall"></div>
          <div class="floor"></div>

          <div class="wall-decor">
            <div class="poster"></div>
            <div class="shelf">
              <span class="book b1"></span>
              <span class="book b2"></span>
              <span class="book b3"></span>
            </div>
          </div>

          <div class="bed"><div class="bed-frame"><div class="pillow"></div><div class="blanket"></div></div></div>
          <div class="desk">
            <div class="desk-top"></div><div class="desk-leg"></div>
            <div class="book-open"></div><div class="lamp-mini"></div>
          </div>
          <div class="sofa">
            <div class="sofa-arm a"></div><div class="sofa-seat"></div><div class="sofa-arm b"></div>
          </div>
          <div class="lamp"><div class="lamp-stand"></div><div class="lamp-shade"></div></div>
          <div class="plant"><div class="pot"></div><span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span></div>

          <div id="avatar-mount"></div>

          <div class="light-fx"></div>
          <div class="rain"></div>
        </div>
      </div>

      <!-- 小七气泡 -->
      <div id="home-bubble" class="home-bubble hidden"></div>

      <!-- 小家状态卡片 -->
      <div id="home-status" class="home-status hidden">
        <div><span>心情</span><b id="st-mood">-</b></div>
        <div><span>精力</span><b id="st-energy">-</b></div>
        <div><span>活动</span><b id="st-activity">-</b></div>
      </div>
    </section>

    <!-- 聊天视图 -->
    <section id="view-chat" class="view">
      <div class="chat-layout">
        <div class="chat-header">
          <div class="chat-partner">
            <div class="chat-avatar">小</div>
            <div><strong>小七</strong><small id="chat-status">在线</small></div>
          </div>
          <button id="btn-clear-chat" class="text-btn">清空</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
      </div>
    </section>

    <!-- 语音视图 -->
    <section id="view-voice" class="view">
      <div class="voice-layout">
        <div class="voice-orb" id="voice-orb">🎙</div>
        <h2 id="voice-hint">按住 🎙 说话</h2>
        <p id="voice-text" class="voice-text">小七会听见你，并用声音回应。</p>
        <div class="voice-panel">
          <button id="voice-btn" class="voice-btn" title="按住说话">🎙</button>
          <p class="voice-note" id="voice-note">语音输入：浏览器识别 · 语音输出：浏览器 / 阿里云</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ═══════ 底部输入栏（聊天/小家通用） ═══════ -->
  <footer class="composer-bar">
    <button id="mic-btn" class="composer-mic" title="按住说话">🎤</button>
    <input id="chat-input" placeholder="和小七说点什么…" autocomplete="off">
    <button id="send-btn" class="composer-send">发送</button>
  </footer>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
